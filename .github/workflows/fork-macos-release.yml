name: Fork Intel Mac release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact fork/main commit to build
        required: true
        type: string

      publish:
        description: Publish release after verification. Disable for a signing trial.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: fork-intel-mac-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Saikrishna1876/t3code' && (github.ref == 'refs/heads/main' || !inputs.publish)
    runs-on: macos-15-intel
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Resolve source and next version
        id: meta
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLISH: ${{ inputs.publish }}
        with:
          script: |
            const sha = process.env.SOURCE_SHA;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('A full commit SHA is required.');
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (branch.commit.sha !== sha) throw new Error('fork/main changed. Dispatch the current SHA.');
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const prior = releases.find(r => !r.draft && r.body?.includes(`Fork source: ${sha}`));
            if (prior && process.env.PUBLISH === 'true') {
              core.notice(`Already released: ${prior.html_url}`);
              core.setOutput('skip', 'true');
              return;
            }
            const { data: file } = await github.rest.repos.getContent({ ...context.repo, path: 'apps/desktop/package.json', ref: sha });
            const base = JSON.parse(Buffer.from(file.content, 'base64').toString()).version.split('-')[0];
            const versions = [base, ...releases.map(r => r.tag_name.replace(/^v/, ''))]
              .filter(v => /^\d+\.\d+\.\d+$/.test(v)).map(v => v.split('.').map(Number));
            versions.sort((a, b) => b[0] - a[0] || b[1] - a[1] || b[2] - a[2]);
            if (!versions.length) throw new Error('No valid stable base version found.');
            const [major, minor, patch] = versions[0];
            core.setOutput('version', `${major}.${minor}.${patch + 1}`);
            core.setOutput('sha', sha);

      - name: Checkout source
        if: steps.meta.outputs.skip != 'true'
        env:
          SOURCE_SHA: ${{ steps.meta.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        if: steps.meta.outputs.skip != 'true'
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        if: steps.meta.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install dependencies and verify compatibility
        if: steps.meta.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          fi
          node -e "if (require('./apps/desktop/package.json').dependencies.electron !== '43.6.0') throw Error('Compatibility Electron pin changed')"
          vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
          vp run --filter @t3tools/desktop ensure:electron
          node -e "if (require('./apps/desktop/node_modules/electron/package.json').version !== '43.6.0') throw Error('Installed Electron pin changed')"
          ./node_modules/.bin/vp test run apps/desktop/src/preview/Manager.test.ts apps/desktop/src/electron/ElectronShell.test.ts apps/desktop/src/preview/DesktopBrowserHost.test.ts apps/server/src/preview/ServerBrowser.test.ts apps/desktop/src/window/ContextMenuImage.test.ts
          vp run --filter @t3tools/desktop typecheck

      - name: Set release version and public configuration
        if: steps.meta.outputs.skip != 'true'
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
          cp .env.example .env

      - name: Package Intel Mac app
        id: package
        if: steps.meta.outputs.skip != 'true'
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          MACOS_PRIVATE_CERTIFICATE: ${{ secrets.MACOS_PRIVATE_CERTIFICATE }}
          MACOS_PRIVATE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_PRIVATE_CERTIFICATE_PASSWORD }}
          MACOS_PRIVATE_SIGNING_IDENTITY: ${{ vars.MACOS_PRIVATE_SIGNING_IDENTITY }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
        run: |
          set -euo pipefail
          args=(--platform mac --target dmg --arch x64 --build-version "$RELEASE_VERSION" --output-dir release --verbose)
          configured=0
          for value in "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER" "$APPLE_TEAM_ID" "$MACOS_PROVISIONING_PROFILE"; do
            if [[ -n "$value" ]]; then configured=$((configured + 1)); fi
          done
          private_configured=0
          for value in "$MACOS_PRIVATE_CERTIFICATE" "$MACOS_PRIVATE_CERTIFICATE_PASSWORD" "$MACOS_PRIVATE_SIGNING_IDENTITY"; do
            if [[ -n "$value" ]]; then private_configured=$((private_configured + 1)); fi
          done
          if [[ "$private_configured" != 0 ]]; then
            if [[ "$private_configured" != 3 || "$configured" != 0 ]]; then
              echo '::error::Configure all private signing values and remove Apple signing credentials, or use Apple signing alone.'
              exit 1
            fi
            identity="$(printf '%s' "$MACOS_PRIVATE_SIGNING_IDENTITY" | tr '[:lower:]' '[:upper:]')"
            if [[ ! "$identity" =~ ^[A-F0-9]{40}$ ]]; then
              echo '::error::MACOS_PRIVATE_SIGNING_IDENTITY must be the certificate SHA-1 fingerprint without separators.'
              exit 1
            fi
            umask 077
            keychain="$RUNNER_TEMP/t3-private-signing.keychain-db"
            certificate="$RUNNER_TEMP/t3-private-signing.pem"
            p12="$RUNNER_TEMP/t3-private-signing.p12"
            keychain_password="$(openssl rand -hex 32)"
            echo "::add-mask::$keychain_password"
            printf '%s' "$MACOS_PRIVATE_CERTIFICATE" | base64 -D > "$p12"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            # codesign still needs the identity on its search list with --keychain.
            python3 - "$keychain" <<'PYTHON'
          import shlex, subprocess, sys
          keychain = sys.argv[1]
          existing = shlex.split(subprocess.check_output([
              '/usr/bin/security', 'list-keychains', '-d', 'user',
          ], text=True, timeout=15))
          subprocess.run([
              '/usr/bin/security', 'list-keychains', '-d', 'user', '-s',
              keychain, *[path for path in existing if path != keychain],
          ], check=True, timeout=15)
          PYTHON
            security import "$p12" -k "$keychain" -P "$MACOS_PRIVATE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
            security find-certificate -a -p "$keychain" > "$certificate"
            test "$(rg -c 'BEGIN CERTIFICATE' "$certificate")" = 1
            actual="$(openssl x509 -in "$certificate" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
            test "$actual" = "$identity"
            # User-domain trust can wait for a GUI authorization prompt on CI.
            echo 'Installing code-signing trust in the disposable runner admin domain'
            python3 - "$certificate" <<'PYTHON'
          import subprocess, sys
          subprocess.run([
              'sudo', '-n', '/usr/bin/security', 'add-trusted-cert',
              '-d', '-r', 'trustRoot', '-p', 'codeSign',
              '-k', '/Library/Keychains/System.keychain', sys.argv[1],
          ], check=True, timeout=60)
          PYTHON
            echo 'Checking imported signing identity'
            security find-identity -v -p codesigning "$keychain" | rg -F "$identity"
            security find-identity -v -p codesigning | rg -F "$identity"
            echo 'Checking private-key access before app build'
            probe="$RUNNER_TEMP/t3-private-signing-probe"
            printf 'int main(void) { return 0; }\n' | xcrun clang -x c - -o "$probe"
            python3 - "$identity" "$keychain" "$probe" <<'PYTHON'
          import subprocess, sys
          identity, keychain, probe = sys.argv[1:]
          subprocess.run([
              '/usr/bin/codesign', '--sign', identity, '--force',
              '--keychain', keychain, '--timestamp=none', probe,
          ], check=True, timeout=30)
          subprocess.run([
              '/usr/bin/codesign', '--verify', '--strict', probe,
          ], check=True, timeout=15)
          PYTHON
            rm -f "$probe"
            echo 'Private signing probe passed'
            export CSC_KEYCHAIN="$keychain"
            args+=(--private-signing-identity "$identity")
            echo 'signing=private' >> "$GITHUB_OUTPUT"
          elif [[ "$configured" == 7 ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"
            profile_path="$RUNNER_TEMP/t3code.provisionprofile"
            printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
            security cms -D -i "$profile_path" >/dev/null
            export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
            export T3CODE_MACOS_PROVISIONING_PROFILE="$profile_path"
            args+=(--signed)
            echo 'signing=apple' >> "$GITHUB_OUTPUT"
          elif [[ "$configured" == 0 ]]; then
            echo '::warning::Unsigned release. macOS in-app installation requires signing setup.'
            echo 'signing=unsigned' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Signing configuration is incomplete. Configure all Apple credentials or remove them all.'
            exit 1
          fi
          vp run dist:desktop:artifact "${args[@]}"

      - name: Verify packaged runtime and update feed
        if: steps.meta.outputs.skip != 'true'
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          hdiutil verify "release/T3-Code-${RELEASE_VERSION}-x64.dmg"
          unzip -tq "release/T3-Code-${RELEASE_VERSION}-x64.zip"
          test -s release/latest-mac.yml
          test -s "release/T3-Code-${RELEASE_VERSION}-x64.zip.blockmap"
          python3 - <<'PYTHON'
          import os, plistlib, zipfile
          version = os.environ['RELEASE_VERSION']
          with zipfile.ZipFile(f'release/T3-Code-{version}-x64.zip') as archive:
              names = archive.namelist()
              plist = next(n for n in names if '/Electron Framework.framework/' in n and n.endswith('/Resources/Info.plist'))
              assert plistlib.loads(archive.read(plist))['CFBundleVersion'] == '43.6.0'
              feed_path = next(n for n in names if n.endswith('.app/Contents/Resources/app-update.yml'))
              feed = dict(line.split(':', 1) for line in archive.read(feed_path).decode().splitlines() if ':' in line)
              feed = {k.strip(): v.strip().strip("\"'") for k, v in feed.items()}
              owner, repo = os.environ['GITHUB_REPOSITORY'].split('/')
              assert (feed['provider'], feed['owner'], feed['repo']) == ('github', owner, repo)
          PYTHON
          cd release
          shasum -a 256 ./*.dmg ./*.zip ./*.blockmap ./latest-mac.yml > SHA256SUMS

      - name: Verify private signature from release archive
        if: steps.meta.outputs.skip != 'true' && steps.package.outputs.signing == 'private'
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          MACOS_PRIVATE_SIGNING_IDENTITY: ${{ vars.MACOS_PRIVATE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          extracted="$RUNNER_TEMP/t3-signature-verification"
          mkdir -p "$extracted"
          ditto -x -k "release/T3-Code-${RELEASE_VERSION}-x64.zip" "$extracted"
          apps=("$extracted/"*.app)
          test "${#apps[@]}" = 1
          app="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --extract-certificates="$extracted/signer" "$app"
          actual="$(openssl x509 -inform DER -in "$extracted/signer0" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
          identity="$(printf '%s' "$MACOS_PRIVATE_SIGNING_IDENTITY" | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$identity"
          codesign -d -r- "$app" > release/designated-requirement.txt 2>&1
          rg -F 'identifier "com.t3tools.t3code"' release/designated-requirement.txt
          rg -i -F "$identity" release/designated-requirement.txt
          if rg -q 'cdhash' release/designated-requirement.txt; then
            echo '::error::Private signing must produce a certificate-bound requirement, not a code-hash requirement.'
            exit 1
          fi
          cat release/designated-requirement.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing material
        if: always() && steps.meta.outputs.skip != 'true'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/t3-private-signing.p12" "$RUNNER_TEMP/t3code.provisionprofile"
          rm -f "$RUNNER_TEMP/t3-private-signing-probe"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          if [[ -f "$RUNNER_TEMP/t3-private-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/t3-private-signing.keychain-db"
          fi
          if [[ -f "$RUNNER_TEMP/t3-private-signing.pem" ]]; then
            python3 - "$RUNNER_TEMP/t3-private-signing.pem" <<'PYTHON'
          import subprocess, sys
          certificate = sys.argv[1]
          fingerprint = subprocess.check_output([
              'openssl', 'x509', '-in', certificate, '-noout', '-fingerprint', '-sha1',
          ], text=True, timeout=10).strip().split('=')[1].replace(':', '')
          for args in [
              ['remove-trusted-cert', '-d', certificate],
              ['delete-certificate', '-Z', fingerprint, '/Library/Keychains/System.keychain'],
          ]:
              try:
                  result = subprocess.run(['sudo', '-n', '/usr/bin/security', *args], check=False, timeout=30)
                  if result.returncode:
                      print(f'::warning::Public certificate cleanup {args[0]} exited {result.returncode}')
              except subprocess.TimeoutExpired:
                  print(f'::warning::Public certificate cleanup {args[0]} timed out; continuing cleanup')
          PYTHON
          fi
          rm -f "$RUNNER_TEMP/t3-private-signing.pem"

      - name: Preserve build artifacts
        if: steps.meta.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-intel-mac-${{ steps.meta.outputs.version }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/SHA256SUMS
            release/designated-requirement.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish fork release
        if: steps.meta.outputs.skip != 'true' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_SHA: ${{ steps.meta.outputs.sha }}
          SIGNING: ${{ steps.package.outputs.signing }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/fork-release-notes.md"
          printf 'Intel Mac compatibility build. Electron 43.6.0.\n\nFork source: %s\n\nSigning: %s\n' "$SOURCE_SHA" "$SIGNING" > "$notes"
          if [[ "$SIGNING" == private ]]; then
            printf '\nPrivately signed, not Apple-notarized. First installation and screenshot permission migration require manual setup. Automatic installation remains unverified.\n' >> "$notes"
          elif [[ "$SIGNING" == unsigned ]]; then
            printf '\nUnsigned download. Install manually; macOS automatic installation needs signing configured.\n' >> "$notes"
          fi
          # A draft keeps partial asset uploads out of the update feed.
          gh release create "v${RELEASE_VERSION}" release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "T3 Code fork ${RELEASE_VERSION} (Intel Mac)" --notes-file "$notes" --draft
          gh release edit "v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          printf 'Release: https://github.com/%s/releases/tag/v%s\n' "$GITHUB_REPOSITORY" "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
