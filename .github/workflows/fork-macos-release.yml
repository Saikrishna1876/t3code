name: Fork Intel Mac release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact fork/main commit to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-intel-mac-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Saikrishna1876/t3code' && github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Resolve source and next version
        id: meta
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        with:
          script: |
            const sha = process.env.SOURCE_SHA;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('A full commit SHA is required.');
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (branch.commit.sha !== sha) throw new Error('fork/main changed. Dispatch the current SHA.');
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const prior = releases.find(r => !r.draft && r.body?.includes(`Fork source: ${sha}`));
            if (prior) {
              core.notice(`Already released: ${prior.html_url}`);
              core.setOutput('skip', 'true');
              return;
            }
            const { data: file } = await github.rest.repos.getContent({ ...context.repo, path: 'apps/desktop/package.json', ref: sha });
            const base = JSON.parse(Buffer.from(file.content, 'base64').toString()).version.split('-')[0];
            const versions = [base, ...releases.map(r => r.tag_name.replace(/^v/, ''))]
              .filter(v => /^\d+\.\d+\.\d+$/.test(v)).map(v => v.split('.').map(Number));
            versions.sort((a, b) => b[0] - a[0] || b[1] - a[1] || b[2] - a[2]);
            if (!versions.length) throw new Error('No valid stable base version found.');
            const [major, minor, patch] = versions[0];
            core.setOutput('version', `${major}.${minor}.${patch + 1}`);
            core.setOutput('sha', sha);

      - name: Checkout source
        if: steps.meta.outputs.skip != 'true'
        env:
          SOURCE_SHA: ${{ steps.meta.outputs.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        if: steps.meta.outputs.skip != 'true'
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        if: steps.meta.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install dependencies and verify compatibility
        if: steps.meta.outputs.skip != 'true'
        run: |
          set -euo pipefail
          node -e "if (require('./apps/desktop/package.json').dependencies.electron !== '43.6.0') throw Error('Compatibility Electron pin changed')"
          vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
          vp run --filter @t3tools/desktop ensure:electron
          node -e "if (require('./apps/desktop/node_modules/electron/package.json').version !== '43.6.0') throw Error('Installed Electron pin changed')"
          ./node_modules/.bin/vp test run apps/desktop/src/preview/Clipboard.test.ts apps/desktop/src/preview/Manager.test.ts apps/desktop/src/electron/ElectronShell.test.ts
          vp run --filter @t3tools/desktop typecheck

      - name: Set release version and public configuration
        if: steps.meta.outputs.skip != 'true'
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
          cp .env.example .env

      - name: Package Intel Mac app
        id: package
        if: steps.meta.outputs.skip != 'true'
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
        run: |
          set -euo pipefail
          args=(--platform mac --target dmg --arch x64 --build-version "$RELEASE_VERSION" --output-dir release --verbose)
          configured=0
          for value in "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER" "$APPLE_TEAM_ID" "$MACOS_PROVISIONING_PROFILE"; do
            if [[ -n "$value" ]]; then configured=$((configured + 1)); fi
          done
          if [[ "$configured" == 7 ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"
            profile_path="$RUNNER_TEMP/t3code.provisionprofile"
            printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
            security cms -D -i "$profile_path" >/dev/null
            export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
            export T3CODE_MACOS_PROVISIONING_PROFILE="$profile_path"
            args+=(--signed)
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          elif [[ "$configured" == 0 ]]; then
            echo '::warning::Unsigned release. macOS in-app installation requires signing setup.'
            echo 'signed=false' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Signing configuration is incomplete. Configure all Apple credentials or remove them all.'
            exit 1
          fi
          vp run dist:desktop:artifact "${args[@]}"

      - name: Verify packaged runtime and update feed
        if: steps.meta.outputs.skip != 'true'
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          hdiutil verify "release/T3-Code-${RELEASE_VERSION}-x64.dmg"
          unzip -tq "release/T3-Code-${RELEASE_VERSION}-x64.zip"
          test -s release/latest-mac.yml
          test -s "release/T3-Code-${RELEASE_VERSION}-x64.zip.blockmap"
          python3 - <<'PYTHON'
          import os, plistlib, zipfile
          version = os.environ['RELEASE_VERSION']
          with zipfile.ZipFile(f'release/T3-Code-{version}-x64.zip') as archive:
              names = archive.namelist()
              plist = next(n for n in names if '/Electron Framework.framework/' in n and n.endswith('/Resources/Info.plist'))
              assert plistlib.loads(archive.read(plist))['CFBundleVersion'] == '43.6.0'
              feed_path = next(n for n in names if n.endswith('.app/Contents/Resources/app-update.yml'))
              feed = dict(line.split(':', 1) for line in archive.read(feed_path).decode().splitlines() if ':' in line)
              feed = {k.strip(): v.strip().strip("\"'") for k, v in feed.items()}
              owner, repo = os.environ['GITHUB_REPOSITORY'].split('/')
              assert (feed['provider'], feed['owner'], feed['repo']) == ('github', owner, repo)
          PYTHON
          cd release
          shasum -a 256 ./*.dmg ./*.zip ./*.blockmap ./latest-mac.yml > SHA256SUMS

      - name: Preserve build artifacts
        if: steps.meta.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-intel-mac-${{ steps.meta.outputs.version }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Publish fork release
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_SHA: ${{ steps.meta.outputs.sha }}
          SIGNED: ${{ steps.package.outputs.signed }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/fork-release-notes.md"
          printf 'Intel Mac compatibility build. Electron 43.6.0.\n\nFork source: %s\n\nSigned: %s\n' "$SOURCE_SHA" "$SIGNED" > "$notes"
          if [[ "$SIGNED" != true ]]; then
            printf '\nUnsigned download. Install manually; macOS automatic installation needs signing configured.\n' >> "$notes"
          fi
          # A draft keeps partial asset uploads out of the update feed.
          gh release create "v${RELEASE_VERSION}" release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "T3 Code fork ${RELEASE_VERSION} (Intel Mac)" --notes-file "$notes" --draft
          gh release edit "v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          printf 'Release: https://github.com/%s/releases/tag/v%s\n' "$GITHUB_REPOSITORY" "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
